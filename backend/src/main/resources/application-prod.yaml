spring:
  datasource:
    # Strictly relying on Environment Variables injected by Render
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # In true production, this should be 'validate' and you use Flyway/Liquibase.
      # For now, 'update' is fine while we are rapidly prototyping.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    # Turn off expensive SQL logging in production to save CPU/Memory
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR